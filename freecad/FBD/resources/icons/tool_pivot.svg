<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none"
     stroke="#37474f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- the bar: a member, drawn the same as everywhere else -->
  <line x1="5" y1="26" x2="27" y2="8"/>
  <circle cx="5" cy="26" r="2.2"/>
  <circle cx="27" cy="8" r="2.2"/>

  <!-- the pivot: a solid point on the bar itself, not at either end -->
  <circle cx="16" cy="17" r="1.4" fill="#37474f"/>

  <!-- pinned to the ground, same triangle-and-hatch as a pin support -->
  <path d="M16,17 L20.6,25.2 L11.4,25.2 Z"/>
  <line x1="9.2" y1="25.2" x2="22.8" y2="25.2"/>
  <line x1="10" y1="25.2" x2="7.4" y2="28.4"/>
  <line x1="13.8" y1="25.2" x2="11.2" y2="28.4"/>
  <line x1="17.6" y1="25.2" x2="15" y2="28.4"/>
  <line x1="21.4" y1="25.2" x2="18.8" y2="28.4"/>
</svg>
